<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Roll Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            padding: 40px 16px;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 28px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #2563eb;
        }
        .num-box {
            margin-top: 24px;
            font-size: 36px;
            font-weight: bold;
            color: #60a5fa;
        }
        .score-box {
            margin-top: 16px;
            font-size: 24px;
            font-weight: bold;
            color: #4ade80;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 20px 0 0 0;
            text-align: left;
        }
        li {
            background-color: #262626;
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 6px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }
        .pts {
            color: #facc15;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Random Number Game</h1>
        <p>Roll a number and rack up points from factors and digits.</p>

        <form method="POST">
            <button type="submit">Roll Number</button>
        </form>

        {% if num is not none %}
            <div class="num-box">Num: {{ num }}</div>
            <div class="score-box">Total Score: {{ total }}</div>

            <ul>
                {% for label, points in events %}
                    <li>
                        <span>{{ label }}</span>
                        <span class="pts">+{{ points }}</span>
                    </li>
                {% endfor %}
            </ul>
        {% endif %}
    </div>
</body>
</html>
